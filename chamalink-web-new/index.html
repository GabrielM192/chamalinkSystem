<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1b30" />
    <meta name="description" content="ChamaLink: usimamizi wa fedha za kikundi wazi kwa kila mwanachama. Michango, faini, mikopo na mafao kwenye kumbukumbu moja." />

    <!-- Sehemu za kushiriki kiungo (WhatsApp, Facebook, X): picha ni ya nembo, si ya mtu. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChamaLink" />
    <meta property="og:title" content="ChamaLink" />
    <meta property="og:description" content="Kila shilingi inaonekana. Kila mwanachama anaweza kuithibitisha." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="sw_TZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChamaLink" />
    <meta name="twitter:description" content="Kila shilingi inaonekana. Kila mwanachama anaweza kuithibitisha." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>ChamaLink</title>
    <script>
      // Weka mwonekano na lugha KABLA React haijaanza (hakuna mmweko wa rangi)
      try {
        var th = localStorage.getItem('chamalink.theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = th;
        document.documentElement.style.colorScheme = th;
        var lg = localStorage.getItem('chamalink.lang');
        if (lg === 'en' || lg === 'sw') document.documentElement.lang = lg;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
